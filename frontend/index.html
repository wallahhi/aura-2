<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SoundSense — Assistive Audio & Spatial Awareness</title>
  <meta name="description" content="Real-time assistive system for deaf and hard-of-hearing individuals with spatial audio localization and safety evaluation." />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="src/css/theme.css" />
  <link rel="stylesheet" href="src/css/compass.css" />
  <link rel="stylesheet" href="src/css/feed.css" />
</head>
<body>
  <!-- Standalone Mobile Viewport Shell -->
  <main id="app-container">
    <!-- 1. Minimal Top Status Pill Header -->
    <div id="top-status-mount"></div>

    <!-- 2. Center 360° Directional Compass & Sound Pill Badge -->
    <div id="compass-mount"></div>

    <!-- 3. Bottom Live Conversation Feed (Borderless Typography) -->
    <div id="transcript-mount"></div>

    <!-- 4. Developer Simulator Drawer (Collapsible) -->
    <div id="simulator-bar-mount"></div>

    <!-- Slide-up Secondary Modals -->
    <div id="settings-modal-mount"></div>
    <div id="sos-modal-mount"></div>
  </main>

  <!-- Application Entry Point -->
  <script type="module" src="src/js/app.js"></script>
</body>
</html>
